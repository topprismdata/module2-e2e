[project]
name = "module2-e2e"
version = "0.1.1"
description = "模块② 片区规划集成 E2E：plan-release × assignment-service × service-rules × dq-workbench × sraf × territory-ir（六仓 tag 锁定）"
requires-python = ">=3.10"
dependencies = [
    "plan-release @ git+https://github.com/topprismdata/plan-release.git@v0.2.0",
    "assignment-service @ git+https://github.com/topprismdata/assignment-service.git@v0.2.0",
    "service-rules @ git+https://github.com/topprismdata/service-rules.git@v0.2.0",
    "dq-workbench @ git+https://github.com/topprismdata/dq-workbench.git@v0.1.1",
    "sraf @ git+https://github.com/topprismdata/sales-resource-allocation-framework.git@v0.2.0",
    "territory-ir @ git+https://github.com/topprismdata/Territory-IR.git@v0.3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["module2_e2e*"]
